<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐 · Web 版</title>
    <style>
        /* ================= 基础样式与暗色主题 ================= */
        :root {
            --bg: #0B0C10;
            --panel: #15161A;
            --fg: #EAEAEA;
            --accent: #5B8CFF;
            --accent2: #FF6B9D;
            --muted: #8A8F98;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 顶部搜索栏 */
        header { padding: 20px; display: flex; gap: 10px; background-color: var(--panel); }
        input[type="text"] { flex: 1; padding: 10px 20px; border-radius: 20px; border: none; background: #1A1B20; color: var(--fg); outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: var(--accent); color: #fff; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }

        /* 主体内容区 */
        main { flex: 1; display: flex; overflow: hidden; }
        
        /* 左侧列表 */
        .list-container { flex: 1; overflow-y: auto; padding: 20px; }
        .song-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; border-radius: 8px; }
        .song-item:hover { background: #1A1B20; }
        .song-item.active { color: var(--accent); font-weight: bold; background: #242736; }
        .song-info { display: flex; flex-direction: column; gap: 4px; }
        .song-name { font-size: 15px; }
        .song-artist { font-size: 12px; color: var(--muted); }

        /* 右侧歌词与封面 */
        .player-view { width: 350px; background: var(--panel); display: flex; flex-direction: column; padding: 20px; }
        .cover { width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; background: #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .lyrics-container { flex: 1; overflow-y: auto; margin-top: 20px; text-align: center; scroll-behavior: smooth; }
        .lyric-line { padding: 8px 0; color: var(--muted); font-size: 14px; transition: 0.3s; }
        .lyric-line.active { color: var(--accent2); font-size: 18px; font-weight: bold; }

        /* 底部控制条 */
        footer { background: var(--panel); padding: 15px 20px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #222; }
        .progress-container { display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .progress-bar { flex: 1; cursor: pointer; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 20px; position: relative; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .action-btn { background: transparent; color: var(--fg); padding: 5px; font-size: 18px; }
        .volume-container { position: absolute; right: 0; display: flex; align-items: center; gap: 10px; }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* ===== 新增：VIP 标识与加载提示 ===== */
        .badge-vip {
            display: inline-block;
            background: linear-gradient(135deg, #FFB84D, #FF8C42);
            color: #1a1a1a;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: 700;
            vertical-align: middle;
        }
        .loading-spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid var(--muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* VIP 弹窗 */
        .vip-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }
        .vip-modal-content {
            background: var(--panel);
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .vip-modal-content h3 { color: #FFB84D; margin-bottom: 12px; }
        .vip-modal-content p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 18px; }
        .vip-modal-actions { display: flex; gap: 10px; justify-content: center; }
        .vip-modal-actions button {
            padding: 8px 20px; border-radius: 16px; border: none; cursor: pointer; font-weight: 600;
        }
        .vip-btn-cancel { background: #2A2C33; color: var(--fg); }
        .vip-btn-confirm { background: var(--accent); color: #fff; }
    </style>
</head>
<body>

    <header>
        <input type="text" id="searchInput" placeholder="搜索歌曲、歌手...">
        <button onclick="searchMusic()">搜索</button>
    </header>

    <main>
        <div class="list-container" id="listContainer">
            <div style="text-align: center; color: var(--muted); margin-top: 20%;">请输入关键词搜索音乐</div>
        </div>

        <div class="player-view">
            <img class="cover" id="coverImg" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="封面">
            <div class="lyrics-container" id="lyricsContainer">
                <div style="color: var(--muted);">暂无歌词</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="progress-container">
            <span id="currentTime">00:00</span>
            <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0" oninput="seekAudio()">
            <span id="totalTime">00:00</span>
        </div>
        <div class="controls">
            <button class="action-btn" onclick="playPrev()">⏮</button>
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="action-btn" onclick="playNext()">⏭</button>
            
            <div class="volume-container">
                <button class="action-btn" id="volIcon">🔊</button>
                <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="0.8" oninput="changeVolume()">
            </div>
        </div>
    </footer>

    <audio id="audioPlayer"></audio>

<script>
/* ================= 核心逻辑：多接口故障转移 + 增强解析 ================= */
const audio = document.getElementById('audioPlayer');
const listContainer = document.getElementById('listContainer');
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const lyricsContainer = document.getElementById('lyricsContainer');
const coverImg = document.getElementById('coverImg');

/**
 * 接口配置：内置 10 个，自动切换
 * style: 'meting' → 使用 ?server=netease&type=xxx&...
 * style: 'netease' → 使用 /search?keywords=...
 */
const API_PROVIDERS = [
    { base: 'https://csm.sayqz.com/api/', style: 'meting' },
    { base: 'https://api.i-meto.com/meting/api', style: 'meting' },
    { base: 'https://api.injahow.cn/meting/', style: 'meting' },
    { base: 'https://meting-api-pi-one.vercel.app/api', style: 'meting' },
    { base: 'https://api.liyefeng.top', style: 'netease' },
    { base: 'https://ncm.zhenxin.me', style: 'netease' },
    { base: 'https://zm.i9mr.com', style: 'netease' },
    { base: 'https://music.mcseekeri.com', style: 'netease' },
    { base: 'https://zm.wwoyun.cn', style: 'netease' },
    { base: 'https://api.injahow.cn', style: 'netease' }
];

/** 统一请求函数（自动故障转移） */
async function apiRequest(type, params = {}) {
    const errors = [];
    for (const provider of API_PROVIDERS) {
        try {
            let url;
            if (provider.style === 'meting') {
                const qs = new URLSearchParams({ server: 'netease', type, ...params });
                url = `${provider.base}?${qs.toString()}`;
            } else {
                const pathMap = { search: '/search', url: '/song/url', lyric: '/lyric', detail: '/song/detail' };
                const paramMap = {
                    search: { keywords: params.s || params.keywords || '', limit: params.limit || 30 },
                    url: { id: params.id },
                    lyric: { id: params.id },
                    detail: { ids: params.ids || params.id }
                };
                const qs = new URLSearchParams(paramMap[type] || {});
                url = `${provider.base}${pathMap[type]}?${qs.toString()}`;
            }

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            const res = await fetch(url, { signal: controller.signal });
            clearTimeout(timer);

            if (!res.ok) {
                errors.push(`${provider.base} → HTTP ${res.status}`);
                continue;
            }

            // 音频地址类型特殊处理
            if (type === 'url') {
                const ct = res.headers.get('content-type') || '';
                if (ct.includes('json')) {
                    const data = await res.json();
                    const u = data.url || data.data?.[0]?.url;
                    if (u) return { url: u.startsWith('//') ? 'https:' + u : u, provider };
                } else {
                    const finalUrl = res.url;
                    try { res.body?.cancel(); } catch (e) {}
                    if (finalUrl) return { url: finalUrl, provider };
                }
                errors.push(`${provider.base} → 无有效地址`);
            } else {
                const data = await res.json();
                return { data, provider };
            }
        } catch (e) {
            errors.push(`${provider.base} → ${e.message}`);
        }
    }
    console.error('所有接口失败:', errors);
    throw new Error('所有接口均不可用');
}

// 数据状态
let songs = [];
let currentIndex = -1;
let lyricsData = [];
let lastLyricIndex = -1;

// 1. 搜索音乐（增强：兼容多种返回、封面补全）
async function searchMusic() {
    const kw = document.getElementById('searchInput').value.trim();
    if (!kw) return;
    listContainer.innerHTML = '<div style="text-align: center; color: var(--muted); margin-top: 20%;"><span class="loading-spinner"></span>搜索中...</div>';

    try {
        const { data } = await apiRequest('search', { s: kw, limit: 30 });
        const rawSongs =
            data.result?.songs ||
            data.songs ||
            data.data ||
            (Array.isArray(data) ? data : []);

        songs = rawSongs.map(normalizeSong).filter(s => s.id);
        currentIndex = -1;

        if (songs.length === 0) {
            listContainer.innerHTML = '<div style="text-align: center; color: var(--muted); margin-top: 20%;">没有找到相关歌曲</div>';
            return;
        }

        renderList();
        fillMissingCovers(); // 异步补全缺失封面
    } catch (e) {
        listContainer.innerHTML = `<div style="text-align: center; color: red; margin-top: 20%;">搜索失败：${e.message}</div>`;
    }
}

/** 标准化歌曲对象（兼容两种接口） */
function normalizeSong(s) {
    const artists = s.artists || s.ar || s.artist || [];
    const artistName = Array.isArray(artists)
        ? artists.map(a => a.name || a).join(' / ')
        : (artists || '未知');
    const album = s.album || s.al || {};
    const fee = s.fee ?? 0;
    const isVip = fee === 1 || fee === 4;
    return {
        id: s.id,
        name: s.name || '未知歌曲',
        artist: artistName || '未知',
        album: album.name || '未知专辑',
        cover: album.picUrl || s.picUrl || '',
        duration: Math.floor((s.duration || s.dt || 0) / 1000),
        isVip
    };
}

/** 补全缺失封面（调用详情接口） */
async function fillMissingCovers() {
    const missing = songs.filter(s => !s.cover);
    if (missing.length === 0) return;
    for (const song of missing.slice(0, 10)) {
        try {
            const { data } = await apiRequest('detail', { ids: song.id });
            const detail = data.songs?.[0] || data.data?.[0] || (Array.isArray(data) ? data[0] : null);
            if (detail) {
                const cover = detail.al?.picUrl || detail.album?.picUrl || '';
                if (cover) {
                    song.cover = cover;
                    renderList();
                }
            }
        } catch (e) {}
    }
}

// 2. 渲染列表（增加 VIP 标识、缩略图）
function renderList() {
    listContainer.innerHTML = '';
    songs.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = `song-item ${i === currentIndex ? 'active' : ''}`;
        div.innerHTML = `
            <div class="song-info">
                <div class="song-name">
                    ${escapeHtml(s.name)}
                    ${s.isVip ? '<span class="badge-vip">VIP</span>' : ''}
                </div>
                <div class="song-artist">${escapeHtml(s.artist)} - ${escapeHtml(s.album)}</div>
            </div>
        `;
        div.onclick = () => playMusic(i);
        listContainer.appendChild(div);
    });
}

function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// 3. 播放音乐（增强：VIP 拦截、断流、记忆进度）
async function playMusic(index) {
    if (index < 0 || index >= songs.length) return;
    currentIndex = index;
    renderList();

    const song = songs[index];

    // VIP 拦截
    if (song.isVip) {
        showVipModal(song);
        return;
    }

    lyricsContainer.innerHTML = '<div style="color: var(--muted);"><span class="loading-spinner"></span>加载中...</div>';
    coverImg.src = song.cover || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

    try {
        const { url } = await apiRequest('url', { id: song.id });

        // 彻底卸载旧流，避免 play() interrupted
        audio.pause();
        audio.removeAttribute('src');
        audio.load();

        audio.src = url;
        audio.volume = parseFloat(document.getElementById('volumeBar').value);

        // 记忆进度
        const saved = localStorage.getItem(`progress_${song.id}`);
        if (saved) {
            audio.addEventListener('loadedmetadata', function once() {
                audio.removeEventListener('loadedmetadata', once);
                const t = parseFloat(saved);
                if (t < audio.duration - 3) audio.currentTime = t;
            });
        }

        await audio.play();
        playBtn.innerText = '⏸';

        loadLyrics(song.id);
    } catch (e) {
        console.error('播放失败:', e);
        // 自动跳下一首（如果非单曲循环）
        setTimeout(playNext, 1200);
    }
}

// 4. 加载并解析歌词（增强：支持多时间戳、容错）
async function loadLyrics(songId) {
    try {
        const { data } = await apiRequest('lyric', { id: songId });
        const lrcStr =
            data.lrc?.lyric ||
            (typeof data.lrc === 'string' ? data.lrc : '') ||
            data.lyric ||
            '';
        lyricsData = parseLrc(lrcStr);
        renderLyrics();
    } catch (e) {
        lyricsData = [];
        renderLyrics();
    }
}

/** 增强版 LRC 解析：支持 [mm:ss.xx] / [mm:ss.xxx] / 一行多时间戳 */
function parseLrc(lrc) {
    if (!lrc) return [];
    const result = [];
    const lines = lrc.split(/\r?\n/);
    const timeRegex = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;

    for (const line of lines) {
        const times = [];
        let m;
        timeRegex.lastIndex = 0;
        while ((m = timeRegex.exec(line)) !== null) {
            const min = parseInt(m[1], 10);
            const sec = parseInt(m[2], 10);
            const msStr = m[3] || '0';
            const ms = parseInt(msStr.padEnd(3, '0').slice(0, 3), 10);
            times.push(min * 60 + sec + ms / 1000);
        }
        if (times.length === 0) continue;
        const text = line.replace(/\[[^\]]*\]/g, '').trim();
        if (!text) continue;
        for (const t of times) result.push({ time: t, text });
    }
    result.sort((a, b) => a.time - b.time);
    return result;
}

function renderLyrics() {
    lyricsContainer.innerHTML = '';
    if (lyricsData.length === 0) {
        lyricsContainer.innerHTML = '<div style="color: var(--muted);">暂无歌词</div>';
        lastLyricIndex = -1;
        return;
    }
    lyricsData.forEach((l, i) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.innerText = l.text;
        div.id = `lyric-${i}`;
        lyricsContainer.appendChild(div);
    });
    lastLyricIndex = -1;
}

function syncLyrics(currentTime) {
    if (lyricsData.length === 0) return;
    let active = -1;
    for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime + 0.3 >= lyricsData[i].time) active = i;
        else break;
    }
    if (active !== lastLyricIndex) {
        if (lastLyricIndex >= 0) {
            document.getElementById(`lyric-${lastLyricIndex}`)?.classList.remove('active');
        }
        if (active >= 0) {
            const el = document.getElementById(`lyric-${active}`);
            if (el) {
                el.classList.add('active');
                const containerH = lyricsContainer.clientHeight;
                const elTop = el.offsetTop;
                lyricsContainer.scrollTo({
                    top: elTop - containerH / 2 + el.clientHeight / 2,
                    behavior: 'smooth'
                });
            }
        }
        lastLyricIndex = active;
    }
}

// 5. 播放控制
function togglePlay() {
    if (!audio.src) {
        if (songs.length > 0) playMusic(0);
        return;
    }
    if (audio.paused) {
        audio.play().catch(() => {});
        playBtn.innerText = '⏸';
    } else {
        audio.pause();
        playBtn.innerText = '▶';
    }
}

function playNext() {
    if (songs.length === 0) return;
    const next = (currentIndex + 1) % songs.length;
    playMusic(next);
}

function playPrev() {
    if (songs.length === 0) return;
    const prev = (currentIndex - 1 + songs.length) % songs.length;
    playMusic(prev);
}

function seekAudio() {
    if (!audio.duration) return;
    audio.currentTime = (progressBar.value / 100) * audio.duration;
}

function changeVolume() {
    audio.volume = document.getElementById('volumeBar').value;
    document.getElementById('volIcon').innerText = audio.volume === 0 ? '🔇' : '🔊';
}

// 6. 监听音频事件
audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    currentTimeEl.innerText = formatTime(audio.currentTime);
    totalTimeEl.innerText = formatTime(audio.duration);
    if (document.activeElement !== progressBar) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
    }
    syncLyrics(audio.currentTime);

    // 记忆进度
    if (currentIndex >= 0 && songs[currentIndex]) {
        localStorage.setItem(`progress_${songs[currentIndex].id}`, audio.currentTime);
    }
});

audio.addEventListener('ended', () => {
    playNext();
});

audio.addEventListener('error', () => {
    console.warn('音频错误，尝试下一首');
    setTimeout(playNext, 800);
});

function formatTime(sec) {
    if (isNaN(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

// 7. VIP 弹窗
function showVipModal(song) {
    const modal = document.createElement('div');
    modal.className = 'vip-modal';
    modal.innerHTML = `
        <div class="vip-modal-content">
            <h3>⚠️ VIP 歌曲</h3>
            <p>《${escapeHtml(song.name)}》为 VIP 会员专属，暂无法在本站播放。<br>请前往网易云音乐官方平台收听完整版。</p>
            <div class="vip-modal-actions">
                <button class="vip-btn-cancel">返回</button>
                <button class="vip-btn-confirm">前往网易云</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    const close = () => modal.remove();
    modal.querySelector('.vip-btn-cancel').onclick = close;
    modal.querySelector('.vip-btn-confirm').onclick = () => {
        window.open(`https://music.163.com/song?id=${song.id}`, '_blank');
        close();
    };
    modal.onclick = e => { if (e.target === modal) close(); };
}

// 8. 初始化音量
audio.volume = 0.8;

// 回车搜索
document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchMusic();
});
</script>
</body>
</html>
